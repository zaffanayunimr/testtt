<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flow With Confidence</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="player-container">
        <!-- 0. Start Overlay Screen (Untuk Play BGM & Video Terus Dari Awal) -->
        <div id="start-overlay">
            <button id="start-app-btn">MULA / START</button>
        </div>

        <!-- Scene 1: Logo Video -->
        <video id="videoPlayer1" class="video-layer active" playsinline muted>
            <source src="assets/comp1.mp4" type="video/mp4">
            Browser anda tidak menyokong tag video.
        </video>

        <!-- Scene 2: Language Selection Overlay -->
        <div id="language-overlay">
            <button class="lang-btn" id="btn-bm">BAHASA MELAYU</button>
            <button class="lang-btn" id="btn-en">ENGLISH</button>
            
            <div class="footer-logo">
                <div class="footer-title">FLOW WITH</div>
                <div class="footer-subtitle">Confidence</div>
            </div>
        </div>

        <!-- Scene 3: Intro Video -->
        <video id="videoPlayer2" class="video-layer" playsinline muted>
            <source src="assets/full-intro.mp4" type="video/mp4">
        </video>

        <!-- Skip / Langkau Button -->
        <button id="skip-btn">Langkau</button>

        <!-- Scene 4: Main Menu Overlay -->
        <div id="scene4-overlay">
            <button id="settings-btn" aria-label="Settings">
                <svg class="gear-icon" viewBox="0 0 24 24">
                    <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
                </svg>
            </button>

            <div class="menu-header">
                <h1 class="menu-title">FLOW WITH</h1>
                <h2 class="menu-subtitle">Confidence</h2>
            </div>

            <div class="menu-buttons-container">
                <button class="menu-btn" id="btn-chapter">Bab</button>
                <button class="menu-btn" id="btn-quiz">Kuiz</button>
            </div>
        </div>

       <!-- Scene 5: Settings Overlay Screen -->
<div id="settings-overlay">
    <h1 id="settings-title">Tetapan</h1>

    <!-- Left Home Button -->
    <button id="home-btn" aria-label="Home">
        <svg viewBox="0 0 24 24">
            <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
        </svg>
    </button>

    <!-- Main Content Grid -->
    <div class="settings-grid">
        <!-- Left Box: Audio Controls -->
        <div class="settings-box">
            <div class="box-header-badge header-audio">
                <span id="label-audio">Audio</span>
            </div>

            <div class="audio-control-body">
                <!-- Custom Vertical Slider Track -->
                <div class="volume-slider-container">
                    <input type="range" id="volume-slider" min="0" max="100" value="100">
                    <span id="volume-percentage">100%</span>
                </div>

                <div class="audio-btn-group">
                    <button class="settings-action-btn" id="btn-volume-up">
                        <span class="btn-icon">🔊</span>
                        <span id="text-volume-up">Kuatkan</span>
                    </button>

                    <button class="settings-action-btn" id="btn-volume-down">
                        <span class="btn-icon">🔉</span>
                        <span id="text-volume-down">Perlahankan</span>
                    </button>

                    <button class="settings-action-btn" id="btn-mute">
                        <span class="btn-icon">🔇</span>
                        <span id="text-mute">Senyap</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Right Box: Language Controls -->
        <div class="settings-box">
            <div class="box-header-badge header-lang">
                <span id="label-language">Bahasa</span>
            </div>

            <div class="lang-btn-group">
                <button class="settings-action-btn lang-option-btn" id="btn-set-bm">
                    <!-- Ikon Bendera Malaysia Bulat -->
                    <span class="flag-icon flag-my"></span>
                    <span id="text-lang-bm">Bahasa Melayu</span>
                </button>

                <button class="settings-action-btn lang-option-btn" id="btn-set-en">
                    <!-- Ikon Bendera British/UK Bulat -->
                    <span class="flag-icon flag-uk"></span>
                    <span id="text-lang-en">Bahasa Inggeris</span>
                </button>
            </div>
        </div>
    </div>

    <div class="footer-logo settings-footer">
        <div class="footer-title">FLOW WITH</div>
        <div class="footer-subtitle">Confidence</div>
    </div>

    <button id="back-btn">Kembali</button>
</div>

            <div class="footer-logo settings-footer">
                <div class="footer-title">FLOW WITH</div>
                <div class="footer-subtitle">Confidence</div>
            </div>

            <button id="back-btn">Kembali</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
